<!-- Swap assets/img/pathology-he.jpg (tissue) and assets/img/pathology-ai.jpg (aligned overlay). -->
<figure class="ai-scope" data-ai-scope>
  <div class="ai-scope__stage">
    <div class="ai-scope__clip" role="img" aria-label="Interactive pathology field. Move the lens to compare the tissue with an AI overlay.">
      <img
        class="ai-scope__base"
        src="{{ '/assets/img/pathology-he.jpg' | relative_url }}"
        alt="H&amp;E stained histopathology tissue"
        width="1000"
        height="666"
      >
      <img
        class="ai-scope__ai"
        src="{{ '/assets/img/pathology-ai.jpg' | relative_url }}"
        alt=""
        aria-hidden="true"
        width="1000"
        height="666"
      >
    </div>
    <div class="ai-scope__lens" aria-hidden="true">
      <span class="ai-scope__label">AI view</span>
    </div>
  </div>
  <figcaption class="ai-scope__caption">Move the lens over the tissue to see what the model sees.</figcaption>
</figure>
